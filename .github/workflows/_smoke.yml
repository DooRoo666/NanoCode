name: smoke
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "runner=${{ matrix.os }}"
          uname -a
          xcodebuild -version || true
