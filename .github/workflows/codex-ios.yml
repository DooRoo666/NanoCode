name: Codex iOS (宿主原生)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: 取 Codex 源码
        run: git clone --depth 1 https://github.com/openai/codex.git src
      - name: 安装 iOS target（跟随 rust-toolchain.toml）
        working-directory: src
        run: |
          rustup show active-toolchain || true
          rustup target add aarch64-apple-ios
          rustup target list --installed
      - name: 编译
        working-directory: src/codex-rs
        run: |
          set -o pipefail
          cargo build --release --target aarch64-apple-ios 2>&1 | tail -n 120
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-ios
          path: src/target/aarch64-apple-ios/release/codex
          if-no-files-found: warn
