<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src 'none'; img-src data:; media-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <style>
    html,body{margin:0;padding:0;background:transparent;color:inherit;min-height:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:auto;}
    #mount{padding:14px;box-sizing:border-box;width:max-content;min-width:100%;min-height:100%;}
    #mount svg{display:block;max-width:none!important;height:auto;}
    #error{display:none;padding:18px;font-size:13px;line-height:1.45;white-space:pre-wrap;max-width:520px;box-sizing:border-box;}
    .dark #error{color:#d0d0d0}.light #error{color:#555}
  </style>
  <script>
    if(!window.structuredClone){window.structuredClone=function(value){return JSON.parse(JSON.stringify(value));};}
    if(!Object.hasOwn){Object.hasOwn=function(obj,key){return Object.prototype.hasOwnProperty.call(obj,key);};}
  </script>
  <script src="mermaid.min.js"></script>
</head>
<body>
  <div id="mount"></div><div id="error"></div>
  <script>
    (async function(){
      const args=window.__MT_MERMAID_ARGS||{};
      document.documentElement.className=args.dark?'dark':'light';
      const report=function(type){
        requestAnimationFrame(function(){
          const mount=document.getElementById('mount'),error=document.getElementById('error');
          const visible=type==='error'?error:mount;
          const width=Math.max(visible.scrollWidth||0,document.documentElement.scrollWidth||0,280);
          const height=Math.max(visible.scrollHeight||0,document.documentElement.scrollHeight||0,150);
          try{window.webkit.messageHandlers.mtMermaid.postMessage({type:type,width:Math.ceil(width),height:Math.ceil(height)});}catch(_){ }
        });
      };
      try{
        mermaid.initialize({
          startOnLoad:false,
          securityLevel:'strict',
          theme:args.dark?'dark':'default',
          flowchart:{htmlLabels:false,useMaxWidth:false},
          sequence:{useMaxWidth:false},
          maxTextSize:200000
        });
        const result=await mermaid.render('mt-mermaid-diagram',String(args.source||''));
        document.getElementById('mount').innerHTML=result.svg;
        if(result.bindFunctions)result.bindFunctions(document.getElementById('mount'));
        report('rendered');
      }catch(error){
        const node=document.getElementById('error');node.style.display='block';
        document.getElementById('mount').style.display='none';
        node.textContent='此 Mermaid 图暂时无法预览\n\n'+String(error&&error.message?error.message:error)+'\n\nMermaid 源码：\n'+String(args.source||'');
        report('error');
      }
    })();
  </script>
</body>
</html>
